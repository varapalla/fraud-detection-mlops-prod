
name: Fraud Detection MLOps CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  MIN_PRECISION: "0.50"
  MIN_RECALL: "0.70"
  MIN_ROC_AUC: "0.80"

jobs:
  validate:
    name: Code, Tests, Model Quality and Security
    runs-on: ubuntu-latest

    # Do not expose the secret to every step.
    # This boolean allows scans to be skipped on fork PRs without secrets.
    env:
      SNYK_ENABLED: ${{ secrets.SNYK_TOKEN != '' }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Python lint
        run: ruff check src tests

      - name: Unit tests
        run: pytest -v

      - name: Train fraud detection model
        run: python src/train.py

      - name: Validate model artifact and quality
        run: python src/validate_model.py

      - name: Verify installed dependency versions
        run: |
          python -m pip show fastapi starlette pytest
          python -m pip check

      - name: Audit Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade -r requirements-dev.txt
          python -m pip check
          python -m pip_audit -r requirements-dev.txt


      - name: Set up Snyk CLI
        if: ${{ env.SNYK_ENABLED == 'true' }}
        uses: snyk/actions/setup@master

      - name: Snyk Open Source - dependency scan
        if: ${{ env.SNYK_ENABLED == 'true' }}
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk test \
            --file=requirements-dev.txt \
            --package-manager=pip \
            --severity-threshold=high

      - name: Snyk Code - static application security testing
        if: ${{ env.SNYK_ENABLED == 'true' }}
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk code test --severity-threshold=high

      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

  container:
    name: Build, Scan and Publish Container
    needs: validate
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      SNYK_ENABLED: ${{ secrets.SNYK_TOKEN != '' }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # artifacts/ is gitignored; generate it before building the image.
      - name: Generate model artifact
        run: |
          python src/train.py
          python src/validate_model.py

      - name: Build Docker image
        run: |
          docker build \
            -t fraud-detection-mlops-prod:${GITHUB_SHA} .

      - name: Set up Snyk CLI
        if: ${{ env.SNYK_ENABLED == 'true' }}
        uses: snyk/actions/setup@master

      - name: Snyk Container - image vulnerability scan
        if: ${{ env.SNYK_ENABLED == 'true' }}
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk container test \
            fraud-detection-mlops-prod:${GITHUB_SHA} \
            --file=Dockerfile \
            --severity-threshold=high \
            --exclude-base-image-vulns


      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: fraud-detection-mlops-prod:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      # Publishing from main requires Snyk to be configured.
      - name: Verify Snyk configuration for main
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            echo "::error::Configure SNYK_TOKEN before publishing."
            exit 1
          fi

      - name: Log in to GitHub Container Registry
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Docker image
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        env:
          IMAGE_NAME: ${{ github.repository }}
        run: |
          IMAGE="ghcr.io/${IMAGE_NAME,,}:${GITHUB_SHA}"
          docker tag \
            "fraud-detection-mlops-prod:${GITHUB_SHA}" \
            "$IMAGE"
          docker push "$IMAGE"
          echo "Published image: $IMAGE"
