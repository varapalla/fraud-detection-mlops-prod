
name: Fraud Detection MLOps CI

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "src/**"
      - "requirements.txt"
      - ".github/workflows/mlops-ci.yml"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "src/**"
      - "requirements.txt"
      - ".github/workflows/mlops-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fraud-detection-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  train-and-validate:
    name: Train and Validate Model
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PYTHON_VERSION: "3.12"
      MIN_PRECISION: "0.50"
      MIN_RECALL: "0.70"
      MIN_ROC_AUC: "0.80"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify Python environment
        run: |
          python --version
          python -m pip check

      - name: Train fraud detection model
        run: python src/train.py

      - name: Inspect generated artifacts
        if: always()
        run: |
          if [ -d artifacts ]; then
            ls -lh artifacts/
            if [ -f artifacts/metrics.json ]; then
              cat artifacts/metrics.json
            else
              echo "metrics.json was not generated"
            fi
          else
            echo "Artifacts directory was not generated"
          fi

      - name: Validate model and quality gates
        run: python src/validate_model.py

      - name: Upload model and evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fraud-detection-model-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
