
name: Fraud Detection MLOps CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  validate:
    name: Code, Tests and Model Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Python lint
        run: ruff check src tests

      - name: Unit tests
        run: pytest -v

      - name: Train fraud detection model
        run: python src/train.py

      - name: Validate model artifact and quality
        run: python src/validate_model.py

      - name: Audit dependencies
        run: pip-audit -r requirements.txt

      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

  container:
    name: Build and Scan Container
    needs: validate
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Generate model artifact
        run: |
          python src/train.py
          python src/validate_model.py

      - name: Build Docker image
        run: |
          docker build \
            -t fraud-detection-mlops-prod:${GITHUB_SHA} .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: fraud-detection-mlops-prod:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE_NAME: ${{ github.repository }}
        run: |
          IMAGE="ghcr.io/${IMAGE_NAME,,}:${GITHUB_SHA}"
          docker tag fraud-detection-mlops-prod:${GITHUB_SHA} "$IMAGE"
          docker push "$IMAGE"
